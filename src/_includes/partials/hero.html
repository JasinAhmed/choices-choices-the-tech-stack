<section class="hero">
	<div class="hero-wrapper">
		<div class="hero-info">
			<h1>{{ hero.title }}</h1>
			<div>
				<p>{{ hero.description }}</p>
				<div class="button-wrapper">
					{% for button in hero.buttons %}
						<a class="button {{ button.variant }}" href="{{ button.href }}">{{ button.content }}</a>
					{% endfor %}
				</div>
			</div>
		</div>

		<picture class="hero-picture">
			<source srcset="{{ hero.imageAvif }}" type="image/avif" sizes="(max-width: 600px) 400px, 700px" />
			<source srcset="{{ hero.imageWebp }}" type="image/webp" sizes="(max-width: 600px) 400px, 700px" />
			<img src="{{ hero.imageWebpFallback }}" alt="{{ hero.imageAlt }}" fetchpriority="high" />
		</picture>
	</div>
</section>
