<footer class="site-footer">
	<div class="footer-inner">
		<div class="footer-brand">
			<a href="{% if lang == 'en' %}/en/{% else %}/{% endif %}" class="footer-logo">
				<picture>
					<source srcset="/assets/full-logo-white.svg" media="(prefers-color-scheme: dark)" />
					<img src="/assets/full-logo.svg" alt="{{ navigation.logoAlt }}" width="100" height="70" fetchpriority="low" loading="lazy" />
				</picture>
			</a>

			<h2 class="brand-title">{{ footer.title }}</h2>

			<p class="brand-description">
				<span>{{ footer.descriptionFirst }}</span>
				<span>{{ footer.descriptionSecond }}</span>
			</p>
		</div>

		<nav class="footer-navigation" aria-labelledby="footer-navigation-heading">
			<h2 class="footer-heading" id="footer-navigation-heading">{{ ui.navigation }}</h2>

			<ul>
				{% for link in navigation.links %}
					<li><a href="{{ link.href }}" class="footer-link">{{ link.content }}</a></li>
				{% endfor %}
			</ul>
		</nav>

		<div class="footer-contact">
			<h2 class="footer-heading">{{ ui.contact }}</h2>

			<address>
				<a href="mailto:{{ contact.email }}" class="footer-link">{{ contact.email }}</a>
			</address>

			<div class="footer-demo">
				<a class="button nav" href="mailto:{{ contact.email }}">{{ navigation.button }}</a>
			</div>
		</div>
	</div>

	<div class="footer-bottom">
		<p>&copy; {{ footer.title }}</p>
	</div>
</footer>
